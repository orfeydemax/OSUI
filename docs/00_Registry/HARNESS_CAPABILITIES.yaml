# HARNESS_CAPABILITIES.yaml — Реестр инфраструктурных возможностей
# Описывает, какие harness-операции система способна выполнить.
# Обновляется при добавлении/удалении скриптов/инструментов.

last_updated: "2026-04-08"
updated_by: "Phase 6 — ACT: HARDEN"

capabilities:

  capture_baseline:
    status: "working"
    description: "Фиксация текущего состояния системы перед изменением"
    implementation: ".agent/scripts/capture_baseline.py"
    what_it_does:
      - "Копирует PRODUCT_SURFACE_STATE.yaml, HARNESS_CAPABILITIES.yaml, PROJECT_BRAIN.yaml"
      - "Фиксирует git commit hash"
      - "Создаёт baseline_manifest.json в .tmp/baselines/{change_id}/"
    tested: true
    gaps: []

  replay_protected_flow:
    status: "partial"
    description: "Проигрывание protected behavior contract"
    implementation: ".agent/scripts/replay_protected_flow.py"
    what_it_does:
      - "Парсит protected_behavior_contract.md"
      - "Генерирует structured JSON checklist для manual verification"
    gaps:
      - "Автоматический replay (E2E / Playwright) требует target app"
      - "Текущая реализация = manual checklist generator, не автоматический тест"
    blocked_by: "Отсутствие target application с running dev server"

  run_targeted_verify:
    status: "partial"
    description: "Запуск целевой верификации конкретного изменения"
    implementation: ".agent/scripts/checklist.py, verify_all.py"
    tested: false
    gaps:
      - "Скрипты не тестировались в текущем контексте"
      - "Требуют target project с package.json"
    blocked_by: "Отсутствие target project с package.json в текущем workspace"

  collect_surface_diff:
    status: "working"
    description: "Сбор before/after diff по surface state"
    implementation: ".agent/scripts/collect_surface_diff.py"
    what_it_does:
      - "Сравнивает baseline snapshot с текущим состоянием registry-файлов"
      - "Показывает line-level diff: added, removed, unchanged"
      - "Требует предварительный capture_baseline.py"
    tested: true
    gaps: []

  validate_registry_freshness:
    status: "working"
    description: "Проверка актуальности всех реестров"
    implementation: ".agent/scripts/check_registry_freshness.py"
    what_it_does:
      - "Проверяет 5 registry-файлов на freshness (last_updated, file age)"
      - "Поддерживает --strict режим (fail on any stale)"
      - "W-8b fix: --check-surfaces для suspicious no_change detection"
    tested: true
    gaps: []

  emit_release_trace:
    status: "working"
    description: "Генерация structured release trace"
    implementation: ".agent/scripts/emit_release_trace.py"
    what_it_does:
      - "Создаёт JSON trace: chg_id, git commit/tag, verdict, perimeter, memory sync"
      - "Привязывает baseline_ref из capture_baseline.py"
      - "Сохраняет в .tmp/traces/{change_id}_release_trace.json"
    tested: true
    gaps: []
