summary: >
  Редизайн первого экрана (hero) сайта Victor DivePro.
  Цель — сделать первый экран продающим: за 3–5 секунд
  пользователь должен понять суть услуги (дайвинг в Нячанге),
  увидеть ключевые преимущества (трансфер, инструктор, без опыта)
  и иметь доступный CTA без прокрутки.

