what_was_done:
  - Заменён hero hero--culture на hero hero--new (2 колонки: левая — текст+CTA, правая — маршрут)
  - Заголовок уменьшен: clamp(44px, 7vw, 100px) вместо clamp(4rem, 11.4vw, 11rem)
  - Добавлен бейдж: «Нячанг · трансфер из отеля · русскоязычный инструктор»
  - Обновлён подзаголовок: человеческий тон, конкретный оффер
  - Кнопки «Узнать свободные даты» + «Написать инструктору»
  - Добавлена мелкая подпись под CTA
  - Блок доверия: 4 пункта с иконками-чекмарками
  - Правая колонка: 4 route-card (маршрут клиента: отель→инструктаж→погружение→возвращение)
  - Навбар: добавлен VICTOR DIVEPRO рядом с логотипом
  - Меню изменено: «Как проходит» вместо «Что увидите»
  - Блок «Как проходит поездка»: 5 шагов линейного маршрута
  - Блок Виктора: обновлён заголовок и текст, ориентация на доверие
  - Sticky bottom bar для мобайла: «Узнать даты» + «Написать»

raw_input_type: OODA-ТЗ (structured design brief)

acceptance_criteria:
  - За 3 сек понятно: дайвинг в Нячанге
  - Сразу видно: можно без опыта
  - Сразу видно: трансфер из отеля
  - Сразу видно: инструктор рядом под водой
  - Главная кнопка в первом экране без прокрутки
  - На мобиле CTA всегда доступен (sticky bottom bar)
  - Иллюстрации объясняют путь клиента, не просто украшают
  - Заголовок не ломает композицию
  - Текст читается без напряжения
  - Визуал — спокойствие, безопасность, море

