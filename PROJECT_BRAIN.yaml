    - "Human Gates: 8 mandatory approval points"
    - "Context Budget: Hot / Warm / Cold (§23)"
    - "Git Protocol: branch → commit → tag (§12)"

# Ключевые пользовательские потоки
key_user_flows:
  - "Принять сырой запрос → /clay → структурированный черновик"
  - "Оценить и маршрутизировать → /frame → /route → Track + Score"
  - "Реализовать → /build (/create | /enhance | /debug)"
  - "Верифицировать → /verify → evidence + verdict"
  - "Выпустить → /release → observation → done"

# Защищённые поведения (не ломать при enhance)
protected_capabilities:
  - "Forbidden Transitions (§9.3) — 10 запретов"
  - "Human Gates — AI не может закрывать"
  - "Token Budget Guard — Done/ никогда не сканировать целиком"
  - "Agent announcement — обязательно до кода"
  - "Frame обязателен для всех треков"

